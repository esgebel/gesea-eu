title: "GESEA Expert Level Oncology Diploma"

logos:
  - { src: "/assets/img/pathways/esge.png", alt: "European Society for Gynaecological Endoscopy (ESGE)" }
  - { src: "/assets/img/pathways/esgo.png", alt: "European Society of Gynaecological Oncology (ESGO)" }

prerequisites:
  title: "Prerequisites for Expert Level Oncology Diploma"
  items:
    - title: "GESEA MIGS Diploma"
      text: "You have acquired the GESEA MIGS Diploma or ESGO Fellowship Certificate"
    - title: "Peer Reviewed Laparoscopic Hysterectomy or ESGO Fellowship Certificate"
      or_before: "or"
    - title: "Achievement of necessary surgical competence"

steps:
  - title: "Provide documented testimony"
    text: "You must provide your documented testimony of [surgical clinical practice curriculum](https://www.esgo.org/media/2025/01/Attachment_PORTFOLIO.pdf) covering the 5 years after completion of specialty training [(upload here)](https://esge.org/gesea-expert-level-3-surgical-clinical-practice-upload/){: .pd-up}"

  - title: "Expert review of Surgical Procedure"
    lead: "Prerequisites;"
    text: "GESEA MIGS Diploma or Expert review of Laparoscopic Hysterectomy certificate or ESGO Fellowship Certificate [(upload here)](https://esge.org/gesea-expert-level-3-oncology-diploma-upload/){: .pd-up}"

  - title: "Surgical Procedure Steps"
    text: |
      To attain Peer Reviewed Laparoscopic Hysterectomy certificate complete the following steps:

      - [Submit the schedule](https://www.esge.org/gesea-expert-level-oncology-diploma-submit-video-procedure-laparoscopic-hysterectomy/) of your Laparoscopic Hysterectomy stating the date when you will perform the actual procedure, you cannot use existing recorded video material.
      - [Submit your Laparoscopic Hysterectomy video here](https://www.esge.org/gesea-expert-level-oncology-diploma-submit-video-procedure-laparoscopic-hysterectomy/) following the criteria below:
    criteria:
      title: "Laparoscopic Hysterectomy"
      text: |
        The surgeon is expected to perform a total laparoscopic hysterectomy of own choosing.

        The procedure will be evaluated by 2 international expert reviewers on 4 steps of the hysterectomy: Dissection of the broad ligament and the IP ligament, Bladder Dissection, Colpotomy, Laparoscopic vaginal suture.

        For these 4 steps, a specific evaluation scale is used by the reviewers: the H-OSATS scale (Knight S et al. PLoS One. 2018. 2;13(1): e0190580.)

        For recommendations on the technical aspects of a laparoscopic hysterectomy, please consult with attention the article [Surgical steps of total laparoscopic hysterectomy](https://fvvo.eu/articles/surgical-steps-of-total-laparoscopic-hysterectomy/doi/deneme.14.3.050) as published in Facts, Views and Vision in ObGyn, the journal of the ESGE.

        Video examples for these 4 steps are also available in this section.
      videos:
        - { label: "1.1 Broad Ligament", url: "https://vimeo.com/503495555/35f60dd816" }
        - { label: "1.2 IP Ligament", url: "https://vimeo.com/503497699/aa896fa9a6" }
        - { label: "2 Bladder Dissection", url: "https://vimeo.com/503499731/1312015958" }
        - { label: "3 Colpotomy", url: "https://vimeo.com/503501428/fb422b371f" }
        - { label: "4 Laparoscopic Vaginal Suture", url: "https://vimeo.com/503492069/82b23c0274" }

  - title: "GESEA Expert Level 3 Oncology eLearning module"
    text: "Purchase the [GESEA Expert Level Oncology eLearning module](https://academy.esge.org/p/gesea-expert-level) and complete the module (certificate of completion once all lectures are viewed)"

  - title: "Apply for an Observership"
    text: |
      [Apply for an Observership](https://www.esge.org/gesea-expert-level-3-oncology-diploma-apply-for-observership/) at an [accredited ESGO centre](https://gesea.eu/wp-content/uploads/2025/05/Training-cetres_GESEA_2025.pdf)

      - Period of attachment 4 weeks (within one year) and minimum one week per centre
      - For applicant working in an existing centre, 2 weeks must be in a different centre*
    note: "Cost vary for different centres, check at the time of application. Please note that the programme fee does not include any additional costs related to the observership, such as hospital administrative fees, travel, accommodation, or meals."
    after: "Provide certificate of completion of observership [(upload here)](https://www.esge.org/gesea-expert-level-oncology-diploma-certificate-of-completion-of-observership-upload/){: .pd-up}"

  - title: "Submit Procedural Videos"
    lead: "Submit Procedural Videos for Expert Peer Review"
    text: |
      [Submit the schedule](https://www.esge.org/gesea-expert-level-3-oncology-diploma-schedule-a-procedure/) of the following procedures:

      - [Paraaortic lymphadenectomy in MIS](https://gesea.eu/wp-content/uploads/2025/04/Assessment-of-para-aortic-and-pelvic-lymphadenectomy-in-12-steps_1.pdf)
      - [Sentinel lymph node mapping](https://gesea.eu/wp-content/uploads/2025/04/SLN-mapping_1.pdf)
      - [Infra Colic Omentectomy Technique](https://gesea.eu/wp-content/uploads/2025/04/Infra-Colic-Omentectomy_1.pdf)
      - [Lateral Pelvic Spaces Approach in MIS](https://gesea.eu/wp-content/uploads/2025/04/Lateral-pelvic-spaces_1.pdf)

      Stating the date when you will perform the actual procedure, you cannot use existing recorded video material.
    button: { label: "Submit your video procedures here", url: "https://www.esge.org/gesea-expert-level-oncology-diploma-submit-video-procedure/" }

