gallery:
  - title: "GESEA4EU Second General Meeting"
    text: |
      The GESEA4EU project marked another milestone with its second general meeting, held on the 2nd and 3rd of November in Leuven, Belgium, gathering representatives from all 16 project partners. The meeting provided a platform for in-depth discussions and updates on various work packages integral to the project's success.
    photos:
      - "/assets/img/gesea4eu/gallery/gal1-1.webp"
      - "/assets/img/gesea4eu/gallery/gal1-2.webp"
