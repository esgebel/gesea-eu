  - title: "ESGE 32nd Annual Congress"
    text: |
      In the first week of October 2023, over 2000 passionate professionals came together to advance gynaecological endoscopy, with engaging sessions, workshops, live surgeries, and presentations.

      It was a historic moment as we proudly unveiled the groundbreaking GESEA4EU program. This two-year initiative is the evolution of the renowned GESEA programme by ESGE. We are thrilled to have had the opportunity to introduce GESEA4EU to this expansive audience deeply invested in standardizing gynaecological endoscopic training. This marks a significant milestone in advancing our field and ensuring high-quality care for patients worldwide.
    photos:
      - "/assets/img/gesea4eu/gallery/gal2-1.webp"
      - "/assets/img/gesea4eu/gallery/gal2-2.webp"
