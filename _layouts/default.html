<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include nav.html %}
{{ content }}
{% unless page.layout == "home" %}{% include footer.html %}{% endunless %}
<script>
window.GESEA_SITE = {
  base: {{ "" | relative_url | jsonify }},
  sessions: {{ site.sessions | jsonify }},
  centres: {% include centres-json.html %}
};
</script>
{%- for s in page.scripts_cdn %}
<script src="{{ s }}"></script>
{%- endfor %}
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>
{%- for s in page.scripts %}
<script src="{{ '/assets/js/' | append: s | append: '.js' | relative_url }}"></script>
{%- endfor %}
</body>
</html>
